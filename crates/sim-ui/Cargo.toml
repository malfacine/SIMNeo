[package]
name = "sim-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sim-core.workspace = true
sim-storage-import.workspace = true
sim-p2p-t2u = { path = "../sim-p2p-t2u" }
sim-proto-dahua = { path = "../sim-proto-dahua" }
sim-proto-dvrip = { path = "../sim-proto-dvrip" }
sim-media = {path = "../sim-media"}
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-18", "accessibility"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "=0.1.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
