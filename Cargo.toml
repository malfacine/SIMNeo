[workspace]
members = ["crates/sim-core", "crates/sim-storage-import", "crates/sim-ui", "crates/sim-p2p-t2u", "crates/sim-connect", "crates/sim-proto-dahua", "crates/sim-proto-dvrip", "crates/sim-media"]
default-members = ["crates/sim-ui"]
resolver = "3"

[workspace.package]
version = "0.26.0"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-storage-import = { path = "crates/sim-storage-import" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
